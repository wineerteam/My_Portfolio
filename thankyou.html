<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Thank you for reaching out to Sunil Kumar Yadav.">
<title>Message Sent | Sunil Kumar Yadav</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --green:#00f5a0;
  --cyan:#00d9ff;
  --blue:#087cff;
  --white:#f5fbff;
  --muted:#d6e5ee;
}

html,body{
  width:100%;
  height:100%;
}

body{
  min-height:100vh;
  overflow:hidden;
  display:grid;
  place-items:center;
  padding:20px;
  font-family:"Plus Jakarta Sans",sans-serif;
  color:var(--white);
  background:#02040a;
}


/* =========================
   GALAXY
========================= */

.galaxy{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  background:#02040a;
  perspective:1400px;
  cursor:default;
}

.galaxy-image{
  position:absolute;
  inset:-4%;
  width:108%;
  height:108%;
  object-fit:cover;
  object-position:center;
  display:block;

  transform:
    translate3d(0,0,0)
    scale(1.035);

  filter:
    brightness(.95)
    saturate(1.08);

  will-change:transform;
  user-select:none;
  -webkit-user-drag:none;

  transition:filter .35s ease;
}

.galaxy-overlay{
  position:absolute;
  inset:0;
  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 0%,
      rgba(0,0,8,.08) 55%,
      rgba(0,0,5,.32) 100%
    );
}


/* =========================
   SUBTLE STAR MOVEMENT
========================= */

.stars{
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.18;

  background-image:
    radial-gradient(
      circle,
      rgba(255,255,255,.9) 0 1px,
      transparent 1.6px
    ),
    radial-gradient(
      circle,
      rgba(0,220,255,.7) 0 1px,
      transparent 1.7px
    );

  background-size:170px 160px,250px 220px;
  background-position:30px 20px,100px 80px;

  animation:stars 45s linear infinite;
}

@keyframes stars{
  to{
    transform:translate3d(-55px,35px,0);
  }
}


/* =========================
   CARD
========================= */

.container{
  position:relative;
  z-index:5;

  width:min(390px,94vw);

  padding:28px 27px 25px;

  text-align:center;

  border:1px solid rgba(0,225,255,.62);
  border-radius:25px;

  background:
    linear-gradient(
      145deg,
      rgba(3,25,42,.68),
      rgba(2,12,25,.48)
    );

  backdrop-filter:blur(7px) saturate(125%);
  -webkit-backdrop-filter:blur(7px) saturate(125%);

  box-shadow:
    0 0 0 1px rgba(0,245,160,.08) inset,
    0 20px 60px rgba(0,0,0,.58),
    0 0 35px rgba(0,217,255,.18);

  animation:cardIn .75s cubic-bezier(.2,.75,.25,1);
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(22px) scale(.96);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}


/* =========================
   SUCCESS ICON
========================= */

.success-icon{
  width:56px;
  height:56px;
  margin:0 auto 10px;

  display:grid;
  place-items:center;

  border:3px solid var(--cyan);
  border-radius:50%;

  color:var(--cyan);
  background:rgba(0,20,35,.48);

  box-shadow:
    0 0 18px rgba(0,217,255,.65);

  animation:glow 2.5s ease-in-out infinite;
}

.success-icon svg{
  width:31px;
  height:31px;
}

@keyframes glow{
  50%{
    box-shadow:
      0 0 30px rgba(0,217,255,.85),
      0 0 45px rgba(0,245,160,.22);
  }
}


/* =========================
   TEXT
========================= */

.status{
  margin-bottom:5px;
  color:var(--green);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
}

h1{
  margin-bottom:9px;

  font-size:clamp(1.75rem,5vw,2.15rem);
  line-height:1.12;
  font-weight:800;

  background:
    linear-gradient(
      90deg,
      var(--green),
      var(--cyan),
      var(--blue)
    );

  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}

.message{
  max-width:330px;
  margin:0 auto 19px;

  color:var(--muted);

  font-size:12.5px;
  line-height:1.65;
  font-weight:500;
}

.green{
  color:var(--green);
  font-weight:700;
}

.blue{
  color:#63cfff;
  font-weight:700;
}


/* =========================
   BUTTON
========================= */

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  width:min(210px,100%);
  padding:11px 18px;

  border:1px solid rgba(255,255,255,.24);
  border-radius:999px;

  color:#fff;
  background:linear-gradient(90deg,#00df9a,#087cff);

  text-decoration:none;

  font-size:13px;
  font-weight:700;

  box-shadow:
    0 8px 25px rgba(0,150,255,.30);

  transition:
    transform .25s ease,
    filter .25s ease,
    box-shadow .25s ease;
}

.btn:hover{
  transform:translateY(-3px);
  filter:brightness(1.08);

  box-shadow:
    0 14px 32px rgba(0,150,255,.40),
    0 0 25px rgba(0,245,160,.20);
}

.btn svg{
  transition:transform .25s ease;
}

.btn:hover svg{
  transform:translateX(-3px);
}


/* =========================
   FOOTER
========================= */

.footer-note{
  margin-top:16px;

  color:rgba(110,220,255,.88);

  font-size:8px;
  line-height:1.7;
  letter-spacing:.18em;

  text-transform:uppercase;
}

.footer-note span{
  display:block;
  color:rgba(0,245,160,.88);
}


/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  body{
    padding:15px;
  }

  .galaxy-image{
    inset:-6%;
    width:112%;
    height:112%;
  }

  .container{
    width:min(360px,94vw);
    padding:25px 21px 23px;
  }

  .footer-note{
    margin-top:13px;
  }
}


/* =========================
   REDUCED MOTION
========================= */

@media(prefers-reduced-motion:reduce){

  .stars,
  .container,
  .success-icon{
    animation:none!important;
  }

  .galaxy-image,
  .btn{
    transition:none!important;
  }
}
</style>
</head>

<body>

<!-- =========================
     GALAXY BACKGROUND
========================= -->

<div class="galaxy" id="galaxy">

  <img
    src="images/galaxy.png"
    class="galaxy-image"
    id="galaxyImage"
    alt=""
    draggable="false"
  >

  <div class="galaxy-overlay"></div>

  <div class="stars"></div>

</div>


<!-- =========================
     THANK YOU CARD
========================= -->

<main class="container" id="success-card">

  <div class="success-icon" aria-hidden="true">

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>

      <polyline points="22 4 12 14.01 9 11.01"></polyline>
    </svg>

  </div>


  <div class="status">
    Message Received
  </div>


  <h1>
    Message Sent!
  </h1>


  <p class="message">

    Thank you for reaching out.

    Your message was
    <span class="green">
      successfully received
    </span>.

    I'll get back to you
    <span class="blue">
      as soon as possible
    </span>.

  </p>


  <a
    href="index.html"
    class="btn"
    id="back-link"
  >

    <svg
      width="16"
      height="16"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <line
        x1="19"
        y1="12"
        x2="5"
        y2="12"
      ></line>

      <polyline
        points="12 19 5 12 12 5"
      ></polyline>
    </svg>

    Back to Portfolio

  </a>


  <div class="footer-note">

    KEEP EXPLORING

    <span>
      SAME SKY, BIGGER DREAMS
    </span>

  </div>

</main>


<script>
(() => {

  "use strict";

  const galaxy =
    document.getElementById("galaxy");

  const image =
    document.getElementById("galaxyImage");

  if (!galaxy || !image) return;


  /* Reduced motion check */

  if (
    window.matchMedia &&
    window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches
  ) {
    return;
  }


  /* 3D strength */

  const TILT = 2.2;
  const MOVE = 12;
  const NORMAL_ZOOM = 1.035;
  const HOVER_ZOOM = 1.055;


  let targetX = 0;
  let targetY = 0;
  let zoom = NORMAL_ZOOM;

  let currentX = 0;
  let currentY = 0;
  let currentZoom = NORMAL_ZOOM;

  let pointerInside = false;
  let animationRunning = false;


  function animate() {

    currentX +=
      (targetX - currentX) * .08;

    currentY +=
      (targetY - currentY) * .08;

    currentZoom +=
      (zoom - currentZoom) * .06;


    image.style.transform =
      `translate3d(
        ${-currentX * MOVE}px,
        ${-currentY * MOVE}px,
        0
      )
      scale(${currentZoom})
      rotateX(${currentY * TILT}deg)
      rotateY(${currentX * TILT}deg)`;


    const moving =
      Math.abs(targetX - currentX) > .01 ||
      Math.abs(targetY - currentY) > .01 ||
      Math.abs(zoom - currentZoom) > .001;


    if (moving || pointerInside) {
      requestAnimationFrame(animate);
    } else {
      animationRunning = false;
    }

  }


  function startAnimation() {

    if (animationRunning) return;

    animationRunning = true;

    requestAnimationFrame(animate);
  }


  galaxy.addEventListener(
    "pointermove",
    event => {

      const x =
        event.clientX /
        window.innerWidth - .5;

      const y =
        event.clientY /
        window.innerHeight - .5;


      targetX = x;
      targetY = y;

      zoom = HOVER_ZOOM;

      pointerInside = true;

      startAnimation();
    },
    { passive:true }
  );


  galaxy.addEventListener(
    "pointerleave",
    () => {

      targetX = 0;
      targetY = 0;
      zoom = NORMAL_ZOOM;

      pointerInside = false;

      startAnimation();
    },
    { passive:true }
  );


})();
</script>

</body>
</html>
